[theme]
# Native base theme. The app's dark grey / white switch (sidebar) restyles everything on top of this.
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#1b1c1f"
secondaryBackgroundColor = "#25262a"
textColor = "#e4e4e7"
font = "sans serif"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
