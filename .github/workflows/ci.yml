name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt apscheduler==3.11.0

      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DS_DATABASE_URL: "sqlite:///data/datasentinel.db"

      - name: Run backend tests
        run: pytest --tb=short -q
        env:
          DS_DATABASE_URL: "sqlite:///:memory:"

      - name: Ruff lint
        run: pip install ruff && ruff check app tests --select E,F,W,I --ignore E501

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install all dependencies
        run: pip install -r backend/requirements-dev.txt -r frontend/requirements.txt apscheduler==3.11.0 streamlit-agraph==0.0.45

      - name: Run frontend tests
        run: pytest frontend/tests --tb=short -q

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: datasentinel-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: datasentinel-frontend:ci

  type-check:
    name: mypy type check (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install -r requirements.txt mypy types-requests apscheduler==3.11.0
      - name: mypy
        run: mypy app --ignore-missing-imports --no-strict-optional --exclude "alembic"
